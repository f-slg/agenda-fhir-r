# Ejecuta las pruebas testthat del prototipo en cada cambio.
name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::jsonlite
            any::htmltools
            any::DT
            any::visNetwork
            any::testthat

      - name: Ejecutar pruebas
        run: Rscript scripts/03_tests.R
